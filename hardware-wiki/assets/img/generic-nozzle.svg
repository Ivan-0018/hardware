<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 300" width="420" height="300" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Stand-in illustration of a generic single-fluid spray nozzle.
       Replace with a photo: drop generic-nozzle.png in this folder and
       change the image path in content/design-cycle-content.js -->
  <defs>
    <linearGradient id="brass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a6a2a"/>
      <stop offset=".3" stop-color="#e8c97a"/>
      <stop offset=".55" stop-color="#c79a3e"/>
      <stop offset="1" stop-color="#6e5220"/>
    </linearGradient>
    <linearGradient id="brassDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6e5220"/>
      <stop offset=".4" stop-color="#c9a24f"/>
      <stop offset="1" stop-color="#5a4219"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-30%" width="140%" height="170%"><feDropShadow dx="0" dy="8" stdDeviation="7" flood-opacity=".22"/></filter>
  </defs>
  <g filter="url(#sh)">
    <!-- threaded inlet -->
    <rect x="40" y="122" width="96" height="56" rx="6" fill="url(#brassDark)"/>
    <path d="M52 122v56M64 122v56M76 122v56M88 122v56M100 122v56M112 122v56M124 122v56" stroke="#4d3a16" stroke-width="2" opacity=".45"/>
    <!-- hex body -->
    <path d="M136 104 L216 104 L236 150 L216 196 L136 196 L116 150 Z" fill="url(#brass)"/>
    <path d="M136 104 L216 104 L226 127 L126 127 Z" fill="#f3dc9a" opacity=".45"/>
    <path d="M126 173 L226 173 L216 196 L136 196 Z" fill="#5a4219" opacity=".35"/>
    <!-- tapered tip -->
    <path d="M236 128 L320 138 L320 162 L236 172 Z" fill="url(#brass)"/>
    <rect x="318" y="134" width="22" height="32" rx="5" fill="url(#brassDark)"/>
    <ellipse cx="340" cy="150" rx="4" ry="9" fill="#2e2410"/>
  </g>
</svg>
