<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 300" width="420" height="300" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Stand-in illustration of a small DC diaphragm pump.
       Replace with a photo: drop diaphragm-pump.png in this folder and
       change the image path in embeds/fluid.html + content/design-cycle-content.js -->
  <defs>
    <linearGradient id="motor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9aa0a6"/>
      <stop offset=".35" stop-color="#e3e6e8"/>
      <stop offset=".55" stop-color="#b9bec2"/>
      <stop offset="1" stop-color="#6b7075"/>
    </linearGradient>
    <linearGradient id="head" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a4d52"/>
      <stop offset=".4" stop-color="#2b2d31"/>
      <stop offset="1" stop-color="#16171a"/>
    </linearGradient>
    <linearGradient id="port" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1c1d20"/>
      <stop offset=".45" stop-color="#5a5e64"/>
      <stop offset="1" stop-color="#1c1d20"/>
    </linearGradient>
    <radialGradient id="face" cx=".4" cy=".35" r=".8">
      <stop offset="0" stop-color="#55595e"/>
      <stop offset="1" stop-color="#1d1e21"/>
    </radialGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="8" stdDeviation="7" flood-opacity=".22"/></filter>
  </defs>
  <g filter="url(#sh)">
    <!-- motor can -->
    <rect x="34" y="118" width="190" height="112" rx="14" fill="url(#motor)"/>
    <rect x="22" y="130" width="18" height="88" rx="6" fill="#7d8287"/>
    <rect x="14" y="160" width="10" height="28" rx="3" fill="#caa35a"/>
    <path d="M60 118v112M90 118v112" stroke="#8e9398" stroke-width="2" opacity=".5"/>
    <!-- pump housing -->
    <rect x="214" y="104" width="54" height="140" rx="10" fill="url(#head)"/>
    <ellipse cx="300" cy="174" rx="62" ry="74" fill="url(#head)"/>
    <ellipse cx="318" cy="174" rx="46" ry="58" fill="url(#face)"/>
    <ellipse cx="318" cy="174" rx="30" ry="38" fill="none" stroke="#6a6e74" stroke-width="3" opacity=".6"/>
    <circle cx="296" cy="124" r="5" fill="#8a8f95"/><circle cx="296" cy="224" r="5" fill="#8a8f95"/>
    <circle cx="352" cy="136" r="5" fill="#8a8f95"/><circle cx="352" cy="212" r="5" fill="#8a8f95"/>
    <!-- inlet / outlet barbs -->
    <rect x="276" y="44" width="22" height="70" rx="5" fill="url(#port)"/>
    <rect x="316" y="44" width="22" height="70" rx="5" fill="url(#port)"/>
    <rect x="272" y="56" width="30" height="8" rx="3" fill="#2a2c30"/>
    <rect x="312" y="56" width="30" height="8" rx="3" fill="#2a2c30"/>
    <rect x="272" y="76" width="30" height="8" rx="3" fill="#2a2c30"/>
    <rect x="312" y="76" width="30" height="8" rx="3" fill="#2a2c30"/>
    <!-- wires -->
    <path d="M40 206 C 10 230, 20 262, 60 270" fill="none" stroke="#b53a2e" stroke-width="5" stroke-linecap="round"/>
    <path d="M40 196 C 0 222, 8 270, 70 282" fill="none" stroke="#202124" stroke-width="5" stroke-linecap="round"/>
  </g>
</svg>
